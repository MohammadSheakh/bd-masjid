name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-nest-prisma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-nest-prisma/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Prisma schema & generate client
        run: |
          npm run prisma:schema:build
          npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bd_masjid_test"

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test

  frontend:
    name: Frontend — build & static optimization
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:6733/api/v1
